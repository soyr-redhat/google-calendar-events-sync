apiVersion: batch/v1
kind: CronJob
metadata:
  name: gcal-sync
  namespace: daam-shared
spec:
  schedule: "0 8 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
            - name: gcal-sync
              image: quay.io/sawyer/gcal-sync:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: gcal-sync-config
              volumeMounts:
                - name: sa-key
                  mountPath: /etc/secrets
                  readOnly: true
                - name: oauth-token
                  mountPath: /etc/secrets/oauth
                  readOnly: true
          volumes:
            - name: sa-key
              secret:
                secretName: gcal-sync-sa-key
            - name: oauth-token
              secret:
                secretName: gcal-sync-oauth-token
          restartPolicy: OnFailure
